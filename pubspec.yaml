name: archify2
description: "Archify é um aplicativo multiplataforma para organizar arquivos do dispositivo em pastas e subpastas de forma simples."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  google_fonts: ^9.0.0
  window_manager: ^0.6.0
  material_ui: ^1.10.0
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^10.2.2
  flutter_native_splash: ^2.4.8
  provider: ^6.1.5+1
  iconsx_plus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#5B21B6"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
