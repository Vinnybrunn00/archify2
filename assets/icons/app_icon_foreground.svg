<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
    <mask id="arch">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M422 800 V630 a90 90 0 0 1 180 0 V800 z" fill="#000"/>
    </mask>
    <clipPath id="folderClip">
      <path d="M242 250 h148 q26 0 42 21 l28 39 h322 q42 0 42 42 v398 q0 42 -42 42 H242 q-42 0 -42 -42 V292 q0 -42 42 -42 z"/>
    </clipPath>
  </defs>

  <!-- background -->

  <g transform="translate(512 512) scale(0.72) translate(-512 -530)"><g filter="url(#shadow)">
    <!-- folder back -->
    <path d="M242 250 h148 q26 0 42 21 l28 39 h322 q42 0 42 42 v398 q0 42 -42 42 H242 q-42 0 -42 -42 V292 q0 -42 42 -42 z" fill="url(#back)"/>

    <!-- fanned files -->
    <g filter="url(#soft)">
      <g transform="rotate(-13 512 760)">
        <rect x="350" y="236" width="300" height="420" rx="30" fill="#FB7185"/>
        <rect x="390" y="286" width="150" height="20" rx="10" fill="#fff" opacity="0.7"/>
      </g>
      <g transform="rotate(12 512 760)">
        <rect x="374" y="236" width="300" height="420" rx="30" fill="#34D399"/>
        <rect x="414" y="286" width="170" height="20" rx="10" fill="#fff" opacity="0.7"/>
      </g>
      <g>
        <rect x="362" y="206" width="300" height="440" rx="30" fill="#FBBF24"/>
        <rect x="402" y="256" width="190" height="20" rx="10" fill="#fff" opacity="0.8"/>
        <rect x="402" y="296" width="130" height="20" rx="10" fill="#fff" opacity="0.6"/>
      </g>
    </g>

    <!-- folder front with arch doorway -->
    <g mask="url(#arch)">
      <path d="M236 430 H788 q46 0 46 46 V746 q0 46 -46 46 H236 q-46 0 -46 -46 V476 q0 -46 46 -46 z" fill="url(#front)"/>
      <rect x="190" y="430" width="644" height="14" rx="7" fill="#fff" opacity="0.9"/>
    </g>
    <!-- arch rim -->
    <path d="M422 792 V630 a90 90 0 0 1 180 0 V792" fill="none" stroke="#C7D2FE" stroke-width="10" stroke-linecap="round"/>
  </g>

</g></svg>
